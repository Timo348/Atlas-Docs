name: atlas-docs

services:
  web:
    image: ${ATLAS_IMAGE_REGISTRY:-docker.io/timo348}/atlas-docs-web:${ATLAS_VERSION:-1.5.1}
    pull_policy: missing
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-30002}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${APP_URL:-http://localhost}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      COLLAB_SECRET: ${AUTH_SECRET}
      COLLAB_INTERNAL_URL: http://collab:1234
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PUBLIC_COLLAB_URL: ${COLLAB_PUBLIC_URL:-}
      PUBLIC_COLLAB_PORT: ${COLLAB_PORT:-30003}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  collab:
    image: ${ATLAS_IMAGE_REGISTRY:-docker.io/timo348}/atlas-docs-collab:${ATLAS_VERSION:-1.5.1}
    pull_policy: missing
    init: true
    restart: unless-stopped
    ports:
      - "${COLLAB_PORT:-30003}:1234"
    environment:
      NODE_ENV: production
      PORT: "1234"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      COLLAB_SECRET: ${AUTH_SECRET}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: ${ATLAS_IMAGE_REGISTRY:-docker.io/timo348}/atlas-docs-migrate:${ATLAS_VERSION:-1.5.1}
    pull_policy: missing
    init: true
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    command:
      [
        "sh",
        "-c",
        "./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts",
      ]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    pull_policy: missing
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
