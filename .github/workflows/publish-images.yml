name: Publish Atlas container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v3.1.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: atlas-docs-web
            target: web
          - image: atlas-docs-collab
            target: collab
          - image: atlas-docs-migrate
            target: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/timo348/${{ matrix.image }}
            docker.io/timo348/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag || github.ref_name }}
            type=raw,value=latest

      - id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ATLAS_VERSION=${{ steps.metadata.outputs.version }}
            ATLAS_REVISION=${{ github.sha }}
            ATLAS_BUILD_DATE=${{ steps.build-date.outputs.value }}
